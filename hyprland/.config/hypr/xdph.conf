# xdg-desktop-portal-hyprland (screen sharing). hyprlang syntax, not Lua.
# Apply with: systemctl --user restart xdg-desktop-portal-hyprland

screencopy {
    # Wrapper around hyprland-share-picker: Chrome/Electron open several portal
    # sessions per share, and this answers the repeats with the first choice
    # (see tools/.local/lib/dotfiles_py/dotfiles_tools/share_picker.py).
    # Absolute path: the portal runs as a user service whose PATH may lack ~/.local/bin.
    custom_picker_binary = /home/emon/.local/bin/share-picker

    # Pre-tick "Remember this choice for future requests".
    allow_token_by_default = true
}
