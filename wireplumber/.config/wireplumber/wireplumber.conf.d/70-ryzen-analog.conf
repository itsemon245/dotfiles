monitor.alsa.rules = [
  {
    matches = [
      {
        media.class = "Audio/Sink"
        node.name = "~alsa_output\\.pci-.*analog-stereo"
      }
    ]
    actions = {
      update-props = {
        priority.session = 2000
        priority.driver  = 2000
      }
    }
  }
  {
    matches = [
      {
        media.class = "Audio/Source"
        node.name = "~alsa_input\\.pci-.*analog.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 2000
        priority.driver  = 2000
      }
    }
  }
]
