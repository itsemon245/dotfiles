services:
    redis:
        image: redis:8.0.2-alpine
        container_name: redis
        restart: always
        network_mode: host
        volumes:
            - redis_data:/data
        env_file:
            - .env
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 2h # every 2 hours
            timeout: 10s
            retries: 3
            start_period: 30s
    redisinsight:
        image: redis/redisinsight:2.70
        container_name: redisinsight
        restart: always
        network_mode: host
        env_file:
            - .env

    postgres:
        image: postgres:17-alpine
        container_name: postgres
        restart: always
        network_mode: host
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./postgres-init:/docker-entrypoint-initdb.d
            - ./dumps:/dumps
        env_file:
            - .env
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
            interval: 2h # every 2 hours
            timeout: 10s
            retries: 5
            start_period: 30s

    mysql:
        image: mariadb:11.8
        container_name: mysql
        restart: always
        network_mode: host
        volumes:
            - mysql_data:/var/lib/mysql
        env_file:
            - .env
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-p${MYSQL_ROOT_PASSWORD}"]
            interval: 2h # every 2 hours
            timeout: 10s
            retries: 3
            start_period: 30s

    phpmyadmin:
        image: phpmyadmin/phpmyadmin:5.2.2
        container_name: phpmyadmin
        restart: always
        network_mode: host
        environment:
            PMA_HOST: ${PMA_HOST:-localhost}
            PMA_PORT: ${PMA_PORT:-3306}
            UPLOAD_LIMIT: ${UPLOAD_LIMIT:-300M}
            APACHE_PORT: ${PHPMYADMIN_PORT:-8080}
        env_file:
            - .env
        depends_on:
            - mysql
        volumes:
            - /sessions

    pgadmin:
        image: dpage/pgadmin4:9
        container_name: pgadmin
        restart: always
        network_mode: host
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@mail.com}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-12345678}
            PGADMIN_LISTEN_PORT: ${PGADMIN_PORT:-8081}
            UPLOAD_LIMIT: ${UPLOAD_LIMIT:-300M}
        env_file:
            - .env
        volumes:
            - pgadmin_data:/var/lib/pgadmin
    dbgate:
        image: dbgate/dbgate:latest
        container_name: dbgate
        restart: always
        network_mode: host
        environment:
            PORT: 4000
        volumes:
            - dbgate_data:/root/.dbgate
            - ~/.ssh/default:/root/.ssh/default

volumes:
    redis_data:
    postgres_data:
    mysql_data:
    pgadmin_data:
    dbgate_data:
