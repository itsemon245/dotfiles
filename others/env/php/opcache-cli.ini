; OPcache for CLI processes too: artisan commands, queue workers, `php artisan serve` and test
; runs. A test suite boots the app once per test and re-reads every config and route file; with
; the CLI cache off, PHP compiles them again each time and keeps part of that memory until the
; process ends (artistly's suite: 69 MB → 17 MB at the start, 120 KB → 64 KB kept per test).
opcache.enable_cli = 1
; Check files for changes on every request, so edits show up at once in a dev server.
opcache.revalidate_freq = 0
